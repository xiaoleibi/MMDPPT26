<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kagevideo | Web-kokken</title>
      
    
</head>
<body>

    <a class="back-link" href="index.html">← Til forsiden</a>
    <h1>Kagevideo</h1>

    <div class="placeholder-text">
        <p>Se vores video om at lave en lækker chokoladekage.</p>
        <p>Du kan vælge danske eller engelske undertekster i videoafspilleren.</p>
    </div>

    <div class="video-container">
        <video id="videoPlayer" controls preload="metadata">
            <source src="img/Baker_making_chocolate_cake.mp4" type="video/mp4">
            <track src="subtitles.vtt" kind="subtitles" srclang="en" label="Engelsk" default>
            <track src="subtitles-da.vtt" kind="subtitles" srclang="da" label="Dansk">
            Din browser understøtter ikke videoafspilleren.
        </video>
    </div>

  

</body>
</html>
