<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Style Example</title>

   <style>
     h1 {
            margin-top: 0;
            color: #1769aa;
        }

        p {
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 6px;
            background-color: #1769aa;
            color: white;
            text-decoration: none;
        }

        .button:hover {
            background-color: #0d47a1;
        }

   </style>


</head>
<body>
    <main class="card">
        <h1>Hello, CSS!</h1>
        <p>This page is styled using CSS inside the <code>&lt;style&gt;</code> tag.</p>
        <a class="button" href="#">Learn more</a>
        <a class="button" href="#">cancel </a>
        <button class="button"><a href="#">Click me</a></button>

    </main>
</body>
</html>
